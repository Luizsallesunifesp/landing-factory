<footer class="s-footer-samanta-11" data-secao="footer-samanta-11">
  <div class="lf-wrap footer-samanta-11__grid">
    <div class="footer-samanta-11__id">
      <p class="footer-samanta-11__nome">{{profissional}}</p>
      <p>{{profissao}} · {{registro}}</p>
      <p>{{especialidade}}</p>
    </div>
    <div class="footer-samanta-11__contato">
      <p>{{cidade}}</p>
      <p><a href="{{instagram_link}}" target="_blank" rel="noopener">Instagram {{instagram}}</a></p>
      <p><a href="{{whatsapp_link}}" target="_blank" rel="noopener">WhatsApp {{telefone}}</a></p>
    </div>
    <p class="footer-samanta-11__nota">{{nota_privacidade}}</p>
  </div>
  <div class="lf-wrap">
    <p class="footer-samanta-11__credito">{{credito_prefixo}} <a href="{{credito_url}}" target="_blank" rel="noopener">{{credito_nome}} <span aria-hidden="true">↗</span></a></p>
  </div>
</footer>
