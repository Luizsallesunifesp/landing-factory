<footer class="s-footer-karol-10" data-secao="footer-karol-10">
  <div class="lf-wrap footer-karol-10__wrap">
    <div class="footer-karol-10__grid">
      <div>
        <div class="footer-karol-10__brand">{{nome_negocio}} <span>{{profissao}}</span></div>
        <p class="footer-karol-10__frase">{{frase}}</p>
      </div>
      <div>
        <h5 class="footer-karol-10__titulo">{{titulo_contato}}</h5>
        <p><a href="{{whatsapp_link}}" target="_blank" rel="noopener">{{whatsapp_texto}}</a></p>
        <p><a href="{{instagram_link}}" target="_blank" rel="noopener">{{instagram}}</a></p>
      </div>
      <div>
        <h5 class="footer-karol-10__titulo">{{titulo_endereco}}</h5>
        <p>{{endereco}}</p>
      </div>
    </div>
    <div class="footer-karol-10__bottom">
      <span>© {{ano}} {{nome_negocio}}. {{direitos}}</span>
      <span>{{profissao}} · {{registro}}</span>
    </div>
  </div>
</footer>
