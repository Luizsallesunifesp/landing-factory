<footer class="s-footer-luiz-ricardo-10" data-secao="footer-luiz-ricardo-10">
  <div class="footer-luiz-ricardo-10__wrap">
    <div class="footer-luiz-ricardo-10__top">
      <a class="footer-luiz-ricardo-10__brandmark" href="#top" aria-label="{{nome_negocio}} — topo">
        <svg class="footer-luiz-ricardo-10__rosette" viewBox="0 0 100 100" aria-hidden="true"><use href="#rosette"></use></svg>
        <span class="footer-luiz-ricardo-10__word">{{marca_inicio}}<em>{{marca_fim}}</em></span>
      </a>
      <nav class="footer-luiz-ricardo-10__nav" aria-label="Rodapé">
        {{#links}}
        <a href="{{href}}">{{texto}}</a>
        {{/links}}
        <a href="{{instagram_link}}" target="_blank" rel="noopener">Instagram</a>
        <a href="{{whatsapp_link}}" target="_blank" rel="noopener">WhatsApp</a>
      </nav>
    </div>
    <div class="footer-luiz-ricardo-10__sig">
      <span class="footer-luiz-ricardo-10__left">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        {{slogan}}
      </span>
      <span class="footer-luiz-ricardo-10__right">
        <span class="footer-luiz-ricardo-10__coord" data-coord>BRT --:--:--</span>
        <svg class="footer-luiz-ricardo-10__heart" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-8-4.9-8-10.2A4.8 4.8 0 0 1 12 7.6a4.8 4.8 0 0 1 8 3.2C20 16.1 12 21 12 21z"></path></svg>
      </span>
    </div>
    <p class="footer-luiz-ricardo-10__fine">Feito por {{nome_negocio}}. Todos os direitos reservados.</p>
  </div>
</footer>
