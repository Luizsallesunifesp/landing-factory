<section class="s-sobre-acalm-head-spa-03" data-secao="sobre-acalm-head-spa-03">
  <div class="sobre-acalm-head-spa-03__wrap sobre-acalm-head-spa-03__grid">
    <div class="sobre-acalm-head-spa-03__visual" data-aos="fade-up">
      <div class="sobre-acalm-head-spa-03__frame">
        <img src="{{img:foto}}" alt="{{alt:foto}}" loading="lazy" decoding="async">
      </div>
    </div>
    <div class="sobre-acalm-head-spa-03__copy" data-aos="fade-up">
      <div class="sobre-acalm-head-spa-03__eyebrow">{{eyebrow}}</div>
      <h2 class="sobre-acalm-head-spa-03__titulo">{{titulo}}</h2>
      <p>{{paragrafo_1}}</p>
      <p>{{paragrafo_2}}</p>
      <div class="sobre-acalm-head-spa-03__assinatura">
        <div>
          <div class="sobre-acalm-head-spa-03__sig-nome">{{profissional}}</div>
          <div class="sobre-acalm-head-spa-03__sig-cargo">{{cargo}}</div>
        </div>
      </div>
    </div>
  </div>
</section>
