<section class="s-sobre-elaine-06" data-secao="sobre-elaine-06">
  <div class="sobre-elaine-06__wrap">
    <div class="sobre-elaine-06__grid">
      <div class="sobre-elaine-06__foto sobre-elaine-06__reveal">
        <img src="{{img:foto}}" alt="{{alt:foto}}" loading="lazy" decoding="async">
      </div>
      <div class="sobre-elaine-06__texto sobre-elaine-06__reveal">
        <span class="sobre-elaine-06__eyebrow">{{eyebrow}}</span>
        <h2 class="sobre-elaine-06__titulo">{{titulo}}</h2>
        <p class="sobre-elaine-06__p">{{bio}}</p>
        <p class="sobre-elaine-06__p">{{atendimento}}</p>
        <div class="sobre-elaine-06__stats">
          {{#registros}}
          <div class="sobre-elaine-06__stat"><b>{{rotulo}}</b><span>{{valor}}</span></div>
          {{/registros}}
        </div>
      </div>
    </div>
  </div>
</section>
