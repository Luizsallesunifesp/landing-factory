<section class="s-sobre-carol-benedetti-03" data-secao="sobre-carol-benedetti-03">
  <div class="lf-wrap sobre-carol-benedetti-03__grid">
    <div class="sobre-carol-benedetti-03__media sobre-carol-benedetti-03__reveal">
      <div class="sobre-carol-benedetti-03__blob">
        <div class="sobre-carol-benedetti-03__glow"></div>
        <img src="{{img:foto}}" alt="{{alt:foto}}" loading="lazy" decoding="async">
      </div>
    </div>
    <div class="sobre-carol-benedetti-03__copy sobre-carol-benedetti-03__reveal sobre-carol-benedetti-03__reveal--delay">
      <span class="sobre-carol-benedetti-03__eyebrow">{{eyebrow}}</span>
      <h2 class="sobre-carol-benedetti-03__titulo">{{titulo}}</h2>
      <p>{{paragrafo_1}}</p>
      <p>{{paragrafo_2}}</p>
      <div class="sobre-carol-benedetti-03__stats">
        {{#stats}}
        <div class="sobre-carol-benedetti-03__stat"><span class="sobre-carol-benedetti-03__num">{{numero}}</span><span class="sobre-carol-benedetti-03__lbl">{{rotulo}}</span></div>
        {{/stats}}
      </div>
    </div>
  </div>
</section>
