<section class="s-sobre-karol-03" data-secao="sobre-karol-03">
  <div class="lf-wrap sobre-karol-03__grid">
    <div class="sobre-karol-03__foto" data-aos="fade-up">
      <img src="{{img:foto}}" alt="{{alt:foto}}" loading="lazy" decoding="async">
    </div>
    <div class="sobre-karol-03__copy" data-aos="fade-up">
      <div class="sobre-karol-03__eyebrow">{{eyebrow}}</div>
      <h2 class="sobre-karol-03__titulo">{{titulo}}</h2>
      <p class="sobre-karol-03__texto">{{paragrafo_1}}</p>
      <p class="sobre-karol-03__texto">{{paragrafo_2}}</p>
      <div class="sobre-karol-03__chips">
        {{#chips}}
        <span class="sobre-karol-03__chip">{{texto}}</span>
        {{/chips}}
      </div>
    </div>
  </div>
</section>
