<section class="s-processo-acalm-head-spa-04" data-secao="processo-acalm-head-spa-04">
  <div class="lf-wrap">
    <div class="processo-acalm-head-spa-04__head processo-acalm-head-spa-04__reveal">
      <div class="processo-acalm-head-spa-04__eyebrow">{{eyebrow}}</div>
      <h2 class="processo-acalm-head-spa-04__titulo">{{titulo}}</h2>
      <p class="processo-acalm-head-spa-04__subtitulo">{{subtitulo}}</p>
    </div>
    <div class="processo-acalm-head-spa-04__list processo-acalm-head-spa-04__reveal">
      <div class="processo-acalm-head-spa-04__track"><div class="processo-acalm-head-spa-04__fill"></div></div>
      {{#etapas}}
      <div class="processo-acalm-head-spa-04__step">
        <div class="processo-acalm-head-spa-04__num">{{@num}}</div>
        <div class="processo-acalm-head-spa-04__body">
          <h3 class="processo-acalm-head-spa-04__nome">{{nome}}</h3>
          <p class="processo-acalm-head-spa-04__desc">{{descricao}}</p>
          <span class="processo-acalm-head-spa-04__dur">{{duracao}}</span>
        </div>
      </div>
      {{/etapas}}
    </div>
  </div>
</section>
