<section class="s-processo-samanta-05" data-secao="processo-samanta-05" aria-labelledby="processo-samanta-05-titulo">
  <div class="processo-samanta-05__wrap processo-samanta-05__grid">
    <div class="processo-samanta-05__topo">
      <p class="processo-samanta-05__rotulo">{{rotulo}}</p>
      <h2 id="processo-samanta-05-titulo" class="processo-samanta-05__titulo">{{titulo}}</h2>
    </div>
    <article class="processo-samanta-05__passo processo-samanta-05__passo--1">
      <p class="processo-samanta-05__n">{{passo_label}} 01</p>
      <h3 class="processo-samanta-05__passo-titulo">{{passo1_titulo}}</h3>
      <p>{{passo1_texto}}</p>
    </article>
    <div class="processo-samanta-05__foto">
      <img src="{{img:foto}}" alt="{{alt:foto}}" width="1600" height="1067" loading="lazy" decoding="async" onerror="this.remove()">
    </div>
    <article class="processo-samanta-05__passo processo-samanta-05__passo--2">
      <p class="processo-samanta-05__n">{{passo_label}} 02</p>
      <h3 class="processo-samanta-05__passo-titulo">{{passo2_titulo}}</h3>
      <p>{{passo2_texto}}</p>
    </article>
    <article class="processo-samanta-05__passo processo-samanta-05__passo--3">
      <p class="processo-samanta-05__n">{{passo_label}} 03</p>
      <h3 class="processo-samanta-05__passo-titulo">{{passo3_titulo}}</h3>
      <p>{{passo3_texto}}</p>
    </article>
  </div>
</section>
