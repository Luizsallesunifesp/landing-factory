<section class="s-hero-yahlla-03" data-secao="hero-yahlla-03">
  <img class="hero-yahlla-03__bg" src="{{img:fundo}}" alt="{{alt:fundo}}" loading="eager" fetchpriority="high" decoding="async">
  <div class="hero-yahlla-03__scrim"></div>
  <div class="hero-yahlla-03__glow"></div>
  <div class="lf-wrap hero-yahlla-03__content">
    <div class="hero-yahlla-03__eyebrow">{{etiqueta}}</div>
    <h1 class="hero-yahlla-03__titulo">{{titulo}}</h1>
    <p class="hero-yahlla-03__sub">{{subtitulo}}</p>
    <div class="hero-yahlla-03__cta-row">
      <a class="hero-yahlla-03__btn" href="{{whatsapp_link}}" target="_blank" rel="noopener">{{cta_texto}}</a>
      <a class="hero-yahlla-03__btn hero-yahlla-03__btn--ghost" href="{{cta2_link}}">{{cta2_texto}}</a>
    </div>
  </div>
</section>
