<section class="s-hero-tiago-farma-02" data-secao="hero-tiago-farma-02">
  <div class="lf-wrap hero-tiago-farma-02__grid">
    <div class="hero-tiago-farma-02__visual" data-aos="fade-up">
      <div class="hero-tiago-farma-02__photo-frame">
        <img src="{{img:principal}}" alt="{{alt:principal}}" loading="eager" fetchpriority="high" decoding="async">
      </div>
      <div class="hero-tiago-farma-02__photo-ring"></div>
      <div class="hero-tiago-farma-02__chip hero-tiago-farma-02__chip--1"><div class="hero-tiago-farma-02__num" data-contador>{{chip1_num}}</div><div class="hero-tiago-farma-02__lbl">{{chip1_label}}</div></div>
      <div class="hero-tiago-farma-02__chip hero-tiago-farma-02__chip--2"><div class="hero-tiago-farma-02__num">{{chip2_num}}</div><div class="hero-tiago-farma-02__lbl">{{chip2_label}}</div></div>
    </div>
    <div class="hero-tiago-farma-02__copy" data-aos="fade-up" data-aos-delay="100">
      <div class="hero-tiago-farma-02__eyebrow">{{etiqueta}}</div>
      <h1 class="hero-tiago-farma-02__titulo">{{titulo}}</h1>
      <p class="hero-tiago-farma-02__lead">{{subtitulo}}</p>
      <div class="hero-tiago-farma-02__ctas">
        <a href="{{whatsapp_link}}" class="hero-tiago-farma-02__btn hero-tiago-farma-02__btn--primary" target="_blank" rel="noopener">{{cta_texto}}</a>
        <a href="{{cta2_link}}" class="hero-tiago-farma-02__btn hero-tiago-farma-02__btn--ghost">{{cta2_texto}}</a>
      </div>
      <div class="hero-tiago-farma-02__trust">
        <div class="hero-tiago-farma-02__item"><strong data-contador>{{trust1_num}}</strong><span>{{trust1_label}}</span></div>
        <div class="hero-tiago-farma-02__item"><strong>{{trust2_num}}</strong><span>{{trust2_label}}</span></div>
      </div>
    </div>
  </div>
</section>
