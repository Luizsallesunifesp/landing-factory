<section class="s-hero-vanessa-02" data-secao="hero-vanessa-02">
  <svg class="hero-vanessa-02__flight" viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path class="hero-vanessa-02__path" d="M -20 260 C 200 60, 480 320, 700 90 S 1050 40, 1080 -10" stroke-width="1.5" stroke-dasharray="2 10" fill="none" stroke-linecap="round"></path>
    <circle class="hero-vanessa-02__dot" cx="700" cy="90" r="3.5"></circle>
    <g class="hero-vanessa-02__plane">
      <circle class="hero-vanessa-02__plane-dot" cx="-20" cy="260" r="4.5"></circle>
    </g>
  </svg>
  <div class="hero-vanessa-02__container hero-vanessa-02__grid">
    <div>
      <div class="hero-vanessa-02__eyebrow">{{etiqueta}}</div>
      <h1 class="hero-vanessa-02__titulo">{{{titulo}}}</h1>
      <p class="hero-vanessa-02__sub">{{{subtitulo}}}</p>
      <div class="hero-vanessa-02__cta-row">
        <a class="hero-vanessa-02__btn" data-magnetic href="{{whatsapp_link}}" target="_blank" rel="noopener">{{cta_texto}}</a>
      </div>
      <div class="hero-vanessa-02__trust">
        <span>{{selo1_icone}} <b><span class="hero-vanessa-02__counter" data-target="{{selo1_numero}}">0</span>{{selo1_sufixo}}</b> {{selo1_texto}}</span>
        <span>{{selo2_icone}} <b>{{selo2_destaque}}</b> {{selo2_texto}}</span>
        <span>{{selo3_icone}} <b>{{selo3_destaque}}</b> {{selo3_texto}}</span>
      </div>
    </div>
    <div class="hero-vanessa-02__photo-wrap">
      <div class="hero-vanessa-02__photo-frame" data-tilt>
        <img src="{{img:principal}}" alt="{{alt:principal}}" loading="eager" fetchpriority="high" decoding="async">
      </div>
      <div class="hero-vanessa-02__stamp"><b>{{carimbo_destaque}}</b>{{carimbo_texto}}</div>
    </div>
  </div>
</section>
