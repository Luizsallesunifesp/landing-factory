<section class="s-hero-tiago-head-spa-02" data-secao="hero-tiago-head-spa-02" data-speed="0.22">
  <div class="hero-tiago-head-spa-02__bg"><img src="{{img:fundo}}" alt="{{alt:fundo}}" loading="eager" decoding="async" fetchpriority="high"></div>
  <div class="hero-tiago-head-spa-02__veil"></div>
  <div class="hero-tiago-head-spa-02__wrap">
    <div class="hero-tiago-head-spa-02__in">
      <div class="hero-tiago-head-spa-02__eyebrow hero-tiago-head-spa-02__rv">{{eyebrow}}</div>
      <h1 class="hero-tiago-head-spa-02__titulo hero-tiago-head-spa-02__rv hero-tiago-head-spa-02__d1">{{titulo}}<br><em class="hero-tiago-head-spa-02__g">{{titulo_destaque}}</em></h1>
      <p class="hero-tiago-head-spa-02__lead hero-tiago-head-spa-02__rv hero-tiago-head-spa-02__d2">{{{subtitulo}}}</p>
      <div class="hero-tiago-head-spa-02__cta hero-tiago-head-spa-02__rv hero-tiago-head-spa-02__d3">
        <a href="{{whatsapp_link}}" class="hero-tiago-head-spa-02__btn hero-tiago-head-spa-02__btn--gold" target="_blank" rel="noopener">
          <svg class="hero-tiago-head-spa-02__ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 14.4c-.3-.2-1.7-.8-2-.9-.3-.1-.5-.2-.7.2-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.2-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6.1-.1.3-.4.5-.6.1-.2.2-.3.3-.6 0-.2 0-.4 0-.6 0-.2-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.1 1.1-1.1 2.6s1.2 3 1.3 3.2c.2.2 2.3 3.5 5.5 4.9.8.3 1.4.5 1.8.7.8.2 1.5.2 2 .1.6-.1 1.7-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4M12 2a10 10 0 00-8.6 15L2 22l5.2-1.4A10 10 0 1012 2"></path></svg>
          {{cta_texto}}
        </a>
        <a href="{{cta2_link}}" class="hero-tiago-head-spa-02__btn hero-tiago-head-spa-02__btn--ghost">{{cta2_texto}}</a>
      </div>
      <div class="hero-tiago-head-spa-02__chips hero-tiago-head-spa-02__rv hero-tiago-head-spa-02__d4">
        {{#chips}}
        <span class="hero-tiago-head-spa-02__chip">✦ {{{texto}}}</span>
        {{/chips}}
      </div>
    </div>
  </div>
  <div class="hero-tiago-head-spa-02__scroll">{{scroll_texto}}<i></i></div>
</section>
