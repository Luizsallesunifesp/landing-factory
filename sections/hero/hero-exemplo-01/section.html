<section class="s-hero-exemplo-01" data-secao="hero-exemplo-01">
  <div class="lf-wrap hero-exemplo-01__grid">
    <div class="hero-exemplo-01__texto">
      <p class="hero-exemplo-01__etiqueta">{{etiqueta}}</p>
      <h1 class="hero-exemplo-01__titulo" data-aos="fade-up">{{titulo}}</h1>
      <p class="hero-exemplo-01__sub" data-aos="fade-up" data-aos-delay="100">{{subtitulo}}</p>
      <a class="hero-exemplo-01__cta" href="{{whatsapp_link}}" target="_blank" rel="noopener">{{cta_texto}}</a>
      <p class="hero-exemplo-01__registro">{{profissional}}{{#registro}} · {{registro}}{{/registro}} · {{cidade}}</p>
    </div>
    <figure class="hero-exemplo-01__foto">
      <img src="{{img:principal}}" alt="{{alt:principal}}" loading="eager" fetchpriority="high" decoding="async">
    </figure>
  </div>
</section>
