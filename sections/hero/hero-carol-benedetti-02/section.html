<header class="s-hero-carol-benedetti-02" data-secao="hero-carol-benedetti-02">
  <div class="hero-carol-benedetti-02__media">
    <img src="{{img:fundo}}" alt="{{alt:fundo}}" loading="eager" fetchpriority="high" decoding="async">
  </div>
  <div class="hero-carol-benedetti-02__inner">
    <div class="hero-carol-benedetti-02__eyebrow-wrap">
      <span class="hero-carol-benedetti-02__line"></span>
      <span class="hero-carol-benedetti-02__eyebrow">{{etiqueta}}</span>
    </div>
    <h1 class="hero-carol-benedetti-02__titulo">{{titulo}}</h1>
    <p class="hero-carol-benedetti-02__sub">{{subtitulo}}</p>
    <div class="hero-carol-benedetti-02__ctas">
      <a href="{{whatsapp_link}}" target="_blank" rel="noopener" class="hero-carol-benedetti-02__btn hero-carol-benedetti-02__btn--primario">{{cta_texto}}</a>
      <a href="#servicos" class="hero-carol-benedetti-02__btn hero-carol-benedetti-02__btn--ghost">{{cta2_texto}}</a>
    </div>
  </div>
</header>
