<header class="s-hero-mestre-hiroshi-01" data-secao="hero-mestre-hiroshi-01">
  <div class="hero-mestre-hiroshi-01__wrap">
    <div class="hero-mestre-hiroshi-01__marca">
      <span class="hero-mestre-hiroshi-01__m1">{{marca_1}}</span>
      <span class="hero-mestre-hiroshi-01__m2">{{marca_2}}<span class="hero-mestre-hiroshi-01__destaque">.</span></span>
      <span class="hero-mestre-hiroshi-01__m3">{{marca_3}}</span>
    </div>

    <div class="hero-mestre-hiroshi-01__grade">
      <div class="hero-mestre-hiroshi-01__txt">
        <h1 class="hero-mestre-hiroshi-01__titulo" data-palavras="">{{titulo_antes}} <span class="hero-mestre-hiroshi-01__destaque">{{titulo_destaque}}</span> {{titulo_depois}}</h1>
        <p class="hero-mestre-hiroshi-01__sub hero-mestre-hiroshi-01__rev">{{subtitulo}}</p>

        <div class="hero-mestre-hiroshi-01__cta-par hero-mestre-hiroshi-01__rev">
          <span class="hero-mestre-hiroshi-01__glow">
            <a class="hero-mestre-hiroshi-01__btn hero-mestre-hiroshi-01__btn--cta" href="{{cta_link}}">
              {{cta_texto}}
              <svg class="hero-mestre-hiroshi-01__ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
            </a>
          </span>
          <a class="hero-mestre-hiroshi-01__btn hero-mestre-hiroshi-01__btn--vaz" href="{{cta2_link}}">{{cta2_texto}}</a>
        </div>

        <p class="hero-mestre-hiroshi-01__selo hero-mestre-hiroshi-01__rev">{{selo}}</p>
      </div>

      <div class="hero-mestre-hiroshi-01__cronos" aria-hidden="true">
        <span class="hero-mestre-hiroshi-01__cronos-n" data-cronos>{{contador_numero}}</span>
        <span class="hero-mestre-hiroshi-01__cronos-leg">{{contador_legenda}}</span>
      </div>
    </div>
  </div>
</header>
