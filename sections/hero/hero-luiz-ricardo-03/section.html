<section class="s-hero-luiz-ricardo-03" data-secao="hero-luiz-ricardo-03">
  <canvas class="hero-luiz-ricardo-03__field" aria-hidden="true"></canvas>
  <div class="hero-luiz-ricardo-03__bloom" data-depth="0.16" aria-hidden="true"></div>
  <div class="hero-luiz-ricardo-03__wrap hero-luiz-ricardo-03__inner">

    <div class="hero-luiz-ricardo-03__type">
      <h1>
        <span class="hero-luiz-ricardo-03__line hero-luiz-ricardo-03__serif">{{titulo_1}}</span>
        <span class="hero-luiz-ricardo-03__line hero-luiz-ricardo-03__sans">{{titulo_2}}</span>
        <span class="hero-luiz-ricardo-03__line hero-luiz-ricardo-03__serif">{{titulo_3}}</span>
      </h1>
    </div>

    <div class="hero-luiz-ricardo-03__base">
      <div class="hero-luiz-ricardo-03__aside">
        <p class="hero-luiz-ricardo-03__lede">{{lede}} <strong>{{lede_destaque}}</strong></p>
        <div class="hero-luiz-ricardo-03__meta">
          <span>{{meta_esq}}</span>
          <span class="hero-luiz-ricardo-03__rule" aria-hidden="true"></span>
          <span class="hero-luiz-ricardo-03__live">{{meta_status}}</span>
        </div>
      </div>

      <aside class="hero-luiz-ricardo-03__pass" data-reveal="">
        <div class="hero-luiz-ricardo-03__pass-main">
          <div class="hero-luiz-ricardo-03__pass-head">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10h18M7 15h4"></path><rect x="3" y="5" width="18" height="14" rx="2.5"></rect></svg>
            {{cartao_topo}}
          </div>

          <div class="hero-luiz-ricardo-03__route">
            <div class="hero-luiz-ricardo-03__node">
              <span class="hero-luiz-ricardo-03__k">{{rota_de_rotulo}}</span>
              <span class="hero-luiz-ricardo-03__v">{{rota_de}}</span>
            </div>
            <div class="hero-luiz-ricardo-03__arrow" aria-hidden="true">
              <svg class="hero-luiz-ricardo-03__plane" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M21 15.5 3 20l4-8-4-8 18 4.5c1 .3 1 2.7 0 3z"></path></svg>
            </div>
            <div class="hero-luiz-ricardo-03__node hero-luiz-ricardo-03__node--to">
              <span class="hero-luiz-ricardo-03__k">{{rota_para_rotulo}}</span>
              <span class="hero-luiz-ricardo-03__v">{{rota_para}}</span>
            </div>
          </div>

          <h2 class="hero-luiz-ricardo-03__pass-title">{{cartao_titulo}}</h2>
          <p class="hero-luiz-ricardo-03__pass-sub">{{cartao_sub}}</p>

          <div class="hero-luiz-ricardo-03__term" aria-hidden="true">
            <div class="hero-luiz-ricardo-03__cmd">$ <b>{{nome_negocio}}</b> {{terminal_comando}}</div>
            <div class="hero-luiz-ricardo-03__typed" data-linhas="{{terminal_linhas}}">&nbsp;</div>
          </div>

          <div class="hero-luiz-ricardo-03__ctas">
            <a class="hero-luiz-ricardo-03__btn hero-luiz-ricardo-03__btn--signal" href="{{whatsapp_link}}" target="_blank" rel="noopener">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 3.5A10.4 10.4 0 0 0 12 0C6.4 0 1.8 4.5 1.8 10.1a10 10 0 0 0 1.4 5.1L1.7 20.3l5.2-1.4a10.4 10.4 0 0 0 5 1.3c5.6 0 10.2-4.6 10.2-10.1a10 10 0 0 0-2.6-6.6zM12 18.4a8.5 8.5 0 0 1-4.3-1.2l-.3-.2-3.1.8.8-3-.2-.3a8.3 8.3 0 0 1-1.3-4.4c0-4.6 3.8-8.4 8.5-8.4a8.4 8.4 0 0 1 8.4 8.4c0 4.6-3.8 8.3-8.5 8.3zm4.7-6.2c-.3-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.8 6.8 0 0 1-3.4-3c-.3-.4.2-.4.6-1.3.1-.1 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3c-.2.3-.9.9-.9 2.1s.9 2.4 1 2.6c.1.2 1.8 2.7 4.3 3.8 1.6.7 2.2.7 3 .6.5 0 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2 0-.1-.2-.2-.4-.3z"></path></svg>
              {{cta_texto}}
            </a>
            <a class="hero-luiz-ricardo-03__btn" href="{{cta2_link}}">{{cta2_texto}}</a>
          </div>
        </div>

        <div class="hero-luiz-ricardo-03__code" aria-hidden="true">
          <div class="hero-luiz-ricardo-03__bars"></div>
          <div class="hero-luiz-ricardo-03__serial">{{serial}}</div>
        </div>
      </aside>
    </div>

  </div>
</section>
