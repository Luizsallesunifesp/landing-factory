<section class="s-local-elaine-08" data-secao="local-elaine-08" id="local">
  <div class="local-elaine-08__wrap">
    <span class="local-elaine-08__eyebrow">{{eyebrow}}</span>
    <div class="local-elaine-08__grid">
      <div class="local-elaine-08__reveal">
        <h2 class="local-elaine-08__titulo">{{titulo}}</h2>
        <div class="local-elaine-08__item">
          <span class="local-elaine-08__lbl">{{label_endereco}}</span>
          <a class="local-elaine-08__val" target="_blank" rel="noopener" href="{{maps_url}}">{{endereco}}</a>
        </div>
        <div class="local-elaine-08__item">
          <span class="local-elaine-08__lbl">{{label_whatsapp}}</span>
          <a class="local-elaine-08__val" target="_blank" rel="noopener" href="{{whatsapp_link}}">{{telefone}}</a>
        </div>
        <div class="local-elaine-08__item">
          <span class="local-elaine-08__lbl">{{label_instagram}}</span>
          <a class="local-elaine-08__val" target="_blank" rel="noopener" href="{{instagram_link}}">{{instagram}}</a>
        </div>
        <div class="local-elaine-08__item">
          <span class="local-elaine-08__lbl">{{label_atendimento}}</span>
          <span class="local-elaine-08__val">{{atendimento}}</span>
        </div>
      </div>
      <div class="local-elaine-08__cta local-elaine-08__reveal">
        <p>{{cta_frase}}</p>
        <a class="local-elaine-08__btn" href="{{whatsapp_link}}" target="_blank" rel="noopener">
          {{cta_texto}}
        </a>
      </div>
    </div>
  </div>
</section>
