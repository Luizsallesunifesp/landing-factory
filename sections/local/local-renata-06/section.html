<section class="s-local-renata-06" data-secao="local-renata-06">
  <div class="lf-wrap">
    <div class="local-renata-06__head" data-aos="fade-up">
      <div class="local-renata-06__eyebrow">{{eyebrow}}</div>
      <h2 class="local-renata-06__titulo">{{titulo}}</h2>
    </div>
    <div class="local-renata-06__modes" data-aos="fade-up">
      <div class="local-renata-06__card">
        <span class="local-renata-06__tag">{{presencial_tag}}</span>
        <h3 class="local-renata-06__nome">{{presencial_titulo}}</h3>
        <p class="local-renata-06__texto">{{presencial_texto}}</p>
        <div class="local-renata-06__addr"><strong>{{presencial_rotulo}}</strong>{{endereco}}</div>
        <a class="local-renata-06__map" href="{{maps_url}}" target="_blank" rel="noopener">{{maps_texto}}</a>
      </div>
      <div class="local-renata-06__card">
        <span class="local-renata-06__tag">{{online_tag}}</span>
        <h3 class="local-renata-06__nome">{{online_titulo}}</h3>
        <p class="local-renata-06__texto">{{online_texto}}</p>
        <div class="local-renata-06__addr"><strong>{{online_rotulo}}</strong>{{online_detalhe}}</div>
      </div>
    </div>
  </div>
</section>
