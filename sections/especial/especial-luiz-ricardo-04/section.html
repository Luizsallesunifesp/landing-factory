<section class="s-especial-luiz-ricardo-04" data-secao="especial-luiz-ricardo-04">
  <div class="especial-luiz-ricardo-04__wrap">

          <div class="especial-luiz-ricardo-04__row">
            <svg class="especial-luiz-ricardo-04__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 5 5M8 8l6 6M14 8l-6 6"></path></svg>
            <p>{{antes_1}}</p>
          </div>
          <div class="especial-luiz-ricardo-04__row">

            <p>{{antes_3}}</p>
          </div>
        </div>
      </div>

      <div class="especial-luiz-ricardo-04__face especial-luiz-ricardo-04__after">
        <div>
          <div class="especial-luiz-ricardo-04__tag">{{tag_depois}}</div>
          <div class="especial-luiz-ricardo-04__row">
            <svg class="especial-luiz-ricardo-04__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 5 5M8.2 11.2l2 2 4-4.3"></path></svg>
            <p>{{depois_1}}</p>
          </div>
          <div class="especial-luiz-ricardo-04__row">
            <svg class="especial-luiz-ricardo-04__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4.5 13H11l-1 9 8.5-11H12l1-9z"></path></svg>

          <div class="especial-luiz-ricardo-04__row">

        <span class="especial-luiz-ricardo-04__grip-tag">{{grip_tag}}</span>
        <svg class="especial-luiz-ricardo-04__grip" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6-5 6 5 6M15 6l5 6-5 6"></path></svg>

    </div>
    <div class="especial-luiz-ricardo-04__legend">
      <span class="especial-luiz-ricardo-04__lg-drag">

      <span class="especial-luiz-ricardo-04__lg-side">← {{legenda_antes}}</span>
      <span class="especial-luiz-ricardo-04__lg-side especial-luiz-ricardo-04__is-good">{{legenda_depois}} →</span>
