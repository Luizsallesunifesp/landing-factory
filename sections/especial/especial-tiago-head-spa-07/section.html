<section class="s-especial-tiago-head-spa-07" data-secao="especial-tiago-head-spa-07">
  <div class="lf-wrap especial-tiago-head-spa-07__in">
    <div class="especial-tiago-head-spa-07__texto" data-aos="fade-up">
      <div class="especial-tiago-head-spa-07__eyebrow">{{eyebrow}}</div>
      <h2 class="especial-tiago-head-spa-07__titulo">{{titulo}} <em class="especial-tiago-head-spa-07__destaque">{{titulo_destaque}}</em></h2>
      <p class="especial-tiago-head-spa-07__lead">{{lead}}</p>
      <ol class="especial-tiago-head-spa-07__ritual">
        {{#etapas}}
        <li class="especial-tiago-head-spa-07__etapa"><strong>{{nome}}</strong>{{descricao}}</li>
        {{/etapas}}
      </ol>
      <a href="{{whatsapp_link}}" class="especial-tiago-head-spa-07__btn">{{cta_texto}}</a>
    </div>
    <div class="especial-tiago-head-spa-07__img" data-aos="fade-up" data-aos-delay="160">
      <img src="{{img:foto}}" alt="{{alt:foto}}" loading="lazy" decoding="async">
      <div class="especial-tiago-head-spa-07__badge"><b>{{selo_titulo}}</b><span>{{selo_texto}}</span></div>
    </div>
  </div>
</section>
