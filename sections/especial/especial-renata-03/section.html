<section class="s-especial-renata-03" data-secao="especial-renata-03"
  data-txt-pronto="{{rotulo_pronto}}"
  data-txt-inspire="{{rotulo_inspire}}"
  data-txt-segure="{{rotulo_segure}}"
  data-txt-expire="{{rotulo_expire}}"
  data-dica-inicial="{{dica_inicial}}"
  data-dica-inspire="{{dica_inspire}}"
  data-dica-segure="{{dica_segure}}"
  data-dica-expire="{{dica_expire}}"
  data-cta-comecar="{{cta_texto}}"
  data-cta-parar="{{cta_parar}}">
  <div class="especial-renata-03__wrap especial-renata-03__grid">
    <div class="especial-renata-03__copy">
      <div class="especial-renata-03__eyebrow">{{eyebrow}}</div>
      <h2 class="especial-renata-03__titulo">{{titulo}}</h2>
      <p class="especial-renata-03__texto">{{texto}}</p>
      <button class="especial-renata-03__btn" type="button" data-role="toggle">{{cta_texto}}</button>
    </div>
    <div class="especial-renata-03__stage">
      <div class="especial-renata-03__circle-wrap">
        <div class="especial-renata-03__ring"></div>
        <div class="especial-renata-03__ring especial-renata-03__ring--2"></div>
        <div class="especial-renata-03__circle" data-role="circle">
          <span class="especial-renata-03__label" data-role="label">{{rotulo_pronto}}</span>
        </div>
      </div>
      <div class="especial-renata-03__hint" data-role="hint" aria-live="polite">{{dica_inicial}}</div>
    </div>
  </div>
</section>
