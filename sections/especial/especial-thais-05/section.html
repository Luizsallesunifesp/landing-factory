<section class="s-especial-thais-05" data-secao="especial-thais-05" aria-labelledby="especial-thais-05-h">
  <div class="especial-thais-05__doc">
    <div class="especial-thais-05__topo">
      <div class="especial-thais-05__regua"></div>
    </div>

    <h2 class="especial-thais-05__titulo" id="especial-thais-05-h">{{titulo}}</h2>
    <p class="especial-thais-05__lede">{{lede}}</p>

    <div class="especial-thais-05__fig" role="img" aria-label="{{aria_grafico}}">
      <svg class="especial-thais-05__grafico-largo" viewBox="0 0 1000 330" preserveAspectRatio="xMidYMid meet">
        <line class="especial-thais-05__grade" x1="70" y1="70" x2="950" y2="70"></line>
        <line class="especial-thais-05__grade" x1="70" y1="140" x2="950" y2="140"></line>
        <line class="especial-thais-05__grade" x1="70" y1="210" x2="950" y2="210"></line>
        <line class="especial-thais-05__eixo" x1="70" y1="266" x2="950" y2="266"></line>
        <line class="especial-thais-05__eixo" x1="70" y1="52" x2="70" y2="266"></line>

        <line class="especial-thais-05__fantasma" x1="70" y1="86" x2="950" y2="86"></line>
        <text class="especial-thais-05__marca-txt" x="950" y="78" text-anchor="end">{{limite_rotulo}}</text>

        <path class="especial-thais-05__curva" d="M 78 262
             C 120 258, 140 248, 168 236
             C 200 220, 224 194, 252 166
             C 282 136, 318 114, 366 104
             C 404 96, 430 96, 462 98
             C 520 101, 560 106, 606 124
             C 660 145, 700 172, 748 200
             C 802 231, 866 250, 944 260"></path>

        <g class="especial-thais-05__marcadores">
          <g class="especial-thais-05__marcador" data-p="0.02">
            <circle class="especial-thais-05__ponto" cx="78" cy="262" r="5.5"></circle>
            <text class="especial-thais-05__marca-txt especial-thais-05__forte" x="78" y="292" text-anchor="start">{{marco_1_dia}}</text>
            <text class="especial-thais-05__marca-txt" x="78" y="308" text-anchor="start">{{marco_1_rotulo}}</text>
          </g>
          <g class="especial-thais-05__marcador" data-p="0.20">
            <circle class="especial-thais-05__ponto" cx="222" cy="196" r="5.5"></circle>
            <text class="especial-thais-05__marca-txt especial-thais-05__forte" x="222" y="292" text-anchor="middle">{{marco_2_dia}}</text>
            <text class="especial-thais-05__marca-txt" x="222" y="308" text-anchor="middle">{{marco_2_rotulo}}</text>
          </g>
          <g class="especial-thais-05__marcador" data-p="0.44">
            <circle class="especial-thais-05__ponto" cx="462" cy="98" r="5.5"></circle>
            <text class="especial-thais-05__marca-txt especial-thais-05__forte" x="462" y="292" text-anchor="middle">{{marco_3_dia}}</text>
            <text class="especial-thais-05__marca-txt" x="462" y="308" text-anchor="middle">{{marco_3_rotulo}}</text>
          </g>
          <g class="especial-thais-05__marcador" data-p="0.72">
            <circle class="especial-thais-05__ponto" cx="748" cy="200" r="5.5"></circle>
            <text class="especial-thais-05__marca-txt especial-thais-05__forte" x="748" y="292" text-anchor="middle">{{marco_4_dia}}</text>
            <text class="especial-thais-05__marca-txt" x="748" y="308" text-anchor="middle">{{marco_4_rotulo}}</text>
          </g>
          <g class="especial-thais-05__marcador" data-p="0.96">
            <circle class="especial-thais-05__ponto" cx="944" cy="260" r="5.5"></circle>
            <text class="especial-thais-05__marca-txt especial-thais-05__forte" x="944" y="292" text-anchor="end">{{marco_5_dia}}</text>
            <text class="especial-thais-05__marca-txt" x="944" y="308" text-anchor="end">{{marco_5_rotulo}}</text>
          </g>
        </g>
      </svg>

      <!-- Versão estreita: mesma curva, proporção vertical, só os dias. -->
      <svg class="especial-thais-05__grafico-estreito" viewBox="0 0 364 376" preserveAspectRatio="xMidYMid meet">
        <line class="especial-thais-05__grade" x1="38" y1="160" x2="326" y2="160"></line>
        <line class="especial-thais-05__grade" x1="38" y1="240" x2="326" y2="240"></line>
        <line class="especial-thais-05__eixo" x1="38" y1="322" x2="326" y2="322"></line>
        <line class="especial-thais-05__eixo" x1="38" y1="80" x2="38" y2="322"></line>

        <line class="especial-thais-05__fantasma" x1="38" y1="111" x2="326" y2="111"></line>
        <text class="especial-thais-05__marca-txt" x="326" y="100" text-anchor="end">{{limite_rotulo_curto}}</text>

        <path class="especial-thais-05__curva" d="M 41 317
             C 54 312, 61 301, 70 287
             C 81 268, 88 238, 98 205
             C 107 170, 119 144, 135 132
             C 147 123, 156 123, 166 125
             C 185 128, 198 134, 213 155
             C 231 180, 244 212, 260 245
             C 278 281, 299 303, 324 315"></path>

        <g class="especial-thais-05__marcadores">
          <g class="especial-thais-05__marcador" data-p="0.02">
            <circle class="especial-thais-05__ponto" cx="41" cy="317" r="6"></circle>
            <text class="especial-thais-05__marca-txt especial-thais-05__forte" x="38" y="352" text-anchor="start">{{marco_1_dia}}</text>
          </g>
          <g class="especial-thais-05__marcador" data-p="0.20">
            <circle class="especial-thais-05__ponto" cx="88" cy="240" r="6"></circle>
            <text class="especial-thais-05__marca-txt especial-thais-05__forte" x="90" y="352" text-anchor="middle">{{marco_2_dia}}</text>
          </g>
          <g class="especial-thais-05__marcador" data-p="0.44">
            <circle class="especial-thais-05__ponto" cx="166" cy="125" r="6"></circle>
            <text class="especial-thais-05__marca-txt especial-thais-05__forte" x="166" y="352" text-anchor="middle">{{marco_3_dia}}</text>
          </g>
          <g class="especial-thais-05__marcador" data-p="0.72">
            <circle class="especial-thais-05__ponto" cx="260" cy="245" r="6"></circle>
            <text class="especial-thais-05__marca-txt especial-thais-05__forte" x="258" y="352" text-anchor="middle">{{marco_4_dia}}</text>
          </g>
          <g class="especial-thais-05__marcador" data-p="0.96">
            <circle class="especial-thais-05__ponto" cx="324" cy="315" r="6"></circle>
            <text class="especial-thais-05__marca-txt especial-thais-05__forte" x="326" y="352" text-anchor="end">{{marco_5_dia}}</text>
          </g>
        </g>
      </svg>
    </div>

    <div class="especial-thais-05__lista">
      {{#etapas}}
      <div class="especial-thais-05__etapa">
        <div class="especial-thais-05__dia">{{dia}}</div>
        <div>
          <h3 class="especial-thais-05__etapa-titulo">{{nome}}</h3>
          <p class="especial-thais-05__etapa-texto">{{descricao}}</p>
        </div>
      </div>
      {{/etapas}}
    </div>
  </div>
</section>
