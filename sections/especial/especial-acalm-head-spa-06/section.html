<section class="s-especial-acalm-head-spa-06" data-secao="especial-acalm-head-spa-06">
  <div class="especial-acalm-head-spa-06__wrap especial-acalm-head-spa-06__grid">
    <div class="especial-acalm-head-spa-06__photo especial-acalm-head-spa-06__reveal">
      <img src="{{img:foto}}" alt="{{alt:foto}}" loading="lazy" decoding="async">
      <div class="especial-acalm-head-spa-06__tag">{{tag}}</div>
    </div>
    <div class="especial-acalm-head-spa-06__copy especial-acalm-head-spa-06__reveal">
      <div class="especial-acalm-head-spa-06__eyebrow">{{eyebrow}}</div>
      <h2 class="especial-acalm-head-spa-06__titulo">{{titulo}}</h2>
      <p class="especial-acalm-head-spa-06__texto">{{texto}}</p>
      <div class="especial-acalm-head-spa-06__list">
        {{#itens}}
        <div class="especial-acalm-head-spa-06__item"><span class="especial-acalm-head-spa-06__name">{{nome}}</span><span class="especial-acalm-head-spa-06__desc">{{descricao}}</span></div>
        {{/itens}}
      </div>
    </div>
  </div>
</section>
