<section class="s-especial-acalm-head-spa-07" data-secao="especial-acalm-head-spa-07">
  <div class="especial-acalm-head-spa-07__wrap">
    <div class="especial-acalm-head-spa-07__panel" data-reveal>
      <div class="especial-acalm-head-spa-07__copy">
        <div class="especial-acalm-head-spa-07__eyebrow">{{eyebrow}}</div>
        <h2 class="especial-acalm-head-spa-07__titulo">{{titulo}}</h2>
        <p class="especial-acalm-head-spa-07__texto">{{texto}}</p>
      </div>
      <form class="especial-acalm-head-spa-07__form" data-form
        data-wa="{{whatsapp_link}}"
        data-negocio="{{nome_negocio}}"
        data-resumo-vazio="{{resumo_vazio}}"
        data-resumo-com-nome="{{resumo_com_nome}}"
        data-resumo-sem-nome="{{resumo_sem_nome}}"
        data-msg-com-nome="{{msg_com_nome}}"
        data-msg-sem-nome="{{msg_sem_nome}}">
        <div class="especial-acalm-head-spa-07__field">
          <label class="especial-acalm-head-spa-07__label" for="especial-acalm-head-spa-07-ritual">{{label_ritual}}</label>
          <select class="especial-acalm-head-spa-07__input" id="especial-acalm-head-spa-07-ritual" data-ritual>
            {{#rituais}}
            <option value="{{nome}}">{{nome}}</option>
            {{/rituais}}
          </select>
        </div>
        <div class="especial-acalm-head-spa-07__field">
          <label class="especial-acalm-head-spa-07__label" for="especial-acalm-head-spa-07-dia">{{label_dia}}</label>
          <select class="especial-acalm-head-spa-07__input" id="especial-acalm-head-spa-07-dia" data-dia>
            {{#dias}}
            <option value="{{nome}}">{{nome}}</option>
            {{/dias}}
          </select>
        </div>
        <div class="especial-acalm-head-spa-07__field">
          <label class="especial-acalm-head-spa-07__label" for="especial-acalm-head-spa-07-nome">{{label_nome}}</label>
          <input class="especial-acalm-head-spa-07__input" type="text" id="especial-acalm-head-spa-07-nome" data-nome placeholder="{{placeholder_nome}}">
        </div>
        <div class="especial-acalm-head-spa-07__resumo" data-resumo>{{resumo_vazio}}</div>
        <a class="especial-acalm-head-spa-07__cta" data-submit href="{{whatsapp_link}}" target="_blank" rel="noopener">{{cta_texto}}</a>
      </form>
    </div>
  </div>
</section>
