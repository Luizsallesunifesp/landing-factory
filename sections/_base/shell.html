<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:type" content="website">
<meta name="theme-color" content="{{theme_color}}">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{fonts_url}}">
{{{libs_head}}}
<style>
{{{tokens}}}
@media (prefers-reduced-motion: reduce){:root{--motion:0}*{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--c-bg);color:var(--c-text);font-family:var(--f-body);font-size:clamp(16px,1.05vw,18px);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,video{max-width:100%;height:auto;display:block}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.08;margin:0;font-weight:500;text-wrap:balance}
p{margin:0;text-wrap:pretty}
.lf-wrap{width:min(100% - 2*var(--space),var(--max-w));margin-inline:auto}
.lf-wa{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:90;display:flex;align-items:center;gap:10px;padding:14px 18px;border-radius:999px;background:var(--c-primary);color:var(--c-on-primary);text-decoration:none;font-weight:600;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.18);transform:translateY(120%);transition:transform .5s var(--ease)}
.lf-wa.is-on{transform:none}
.lf-wa svg{width:22px;height:22px;flex:none}
:focus-visible{outline:2px solid var(--c-accent);outline-offset:3px}
{{{css}}}
</style>
</head>
<body>
{{{body}}}
<a class="lf-wa" href="{{whatsapp_link}}" target="_blank" rel="noopener" aria-label="Conversar pelo WhatsApp">
<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.4.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>
<span>{{whatsapp_float_text}}</span>
</a>
{{{libs_body}}}
<script>
(function(){
  var root=document.documentElement, motion=parseFloat(getComputedStyle(root).getPropertyValue('--motion'))||0;
  window.LF={motion:motion};
  // botão flutuante aparece depois do primeiro scroll
  var wa=document.querySelector('.lf-wa'); var on=function(){wa&&wa.classList.toggle('is-on',scrollY>window.innerHeight*0.6)};
  addEventListener('scroll',on,{passive:true}); on();
  if(window.AOS){AOS.init({once:true,duration:Math.round(800*(motion||0.001)),easing:'ease-out-cubic',offset:40,disable:motion===0});}
  if(window.gsap&&window.ScrollTrigger){gsap.registerPlugin(ScrollTrigger);}
  if(window.Lenis&&motion>0&&!matchMedia('(pointer:coarse)').matches){
    var lenis=new Lenis({lerp:0.1});window.LF.lenis=lenis;
    if(window.ScrollTrigger){lenis.on('scroll',ScrollTrigger.update);gsap.ticker.add(function(t){lenis.raf(t*1000)});gsap.ticker.lagSmoothing(0);}
    else{(function raf(t){lenis.raf(t);requestAnimationFrame(raf)})(0);}
  }
})();
</script>
{{{js}}}
</body>
</html>
