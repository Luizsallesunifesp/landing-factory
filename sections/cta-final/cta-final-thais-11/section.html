<section class="s-cta-final-thais-11" data-secao="cta-final-thais-11" aria-labelledby="cta-final-thais-11__h">
  <div class="cta-final-thais-11__doc">
    <div class="cta-final-thais-11__topo">
      <div class="cta-final-thais-11__regua"></div>
    </div>

    <div class="cta-final-thais-11__grid">
      <div>
        <h2 id="cta-final-thais-11__h" class="cta-final-thais-11__titulo">{{titulo}}</h2>
        <p class="cta-final-thais-11__lede">{{texto}}</p>
      </div>

      <form class="cta-final-thais-11__form" novalidate data-wa="{{whatsapp_link}}" data-msg-intro="{{msg_intro}}" data-msg-nome="{{msg_nome}}" data-msg-fone="{{msg_fone}}" data-msg-regiao="{{msg_regiao}}" data-msg-final="{{msg_final}}">
        <div class="cta-final-thais-11__campos">
          <div class="cta-final-thais-11__campo">
            <label for="cta-final-thais-11__nome">{{label_nome}}</label>
            <input type="text" id="cta-final-thais-11__nome" name="nome" autocomplete="name" placeholder="{{placeholder_nome}}" required>
            <span class="cta-final-thais-11__erro">{{erro_nome}}</span>
          </div>

          <div class="cta-final-thais-11__campo">
            <label for="cta-final-thais-11__fone">{{label_fone}}</label>
            <input type="tel" id="cta-final-thais-11__fone" name="fone" autocomplete="tel" inputmode="numeric" placeholder="{{placeholder_fone}}" required>
            <span class="cta-final-thais-11__erro">{{erro_fone}}</span>
          </div>

          <div class="cta-final-thais-11__campo cta-final-thais-11__campo--largo">
            <label for="cta-final-thais-11__regiao">{{label_regiao}}</label>
            <select id="cta-final-thais-11__regiao" name="regiao" required>
              <option value="" selected disabled>{{placeholder_regiao}}</option>
              {{#opcoes}}
              <option>{{texto}}</option>
              {{/opcoes}}
            </select>
            <span class="cta-final-thais-11__erro">{{erro_regiao}}</span>
          </div>
        </div>

        <div class="cta-final-thais-11__pe">
          <button type="submit" class="cta-final-thais-11__btn">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.77.46 3.42 1.27 4.86L2 22l5.28-1.24A9.95 9.95 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18.2c-1.6 0-3.09-.47-4.34-1.28l-.31-.19-3.13.74.75-3.05-.2-.32A8.15 8.15 0 0 1 3.8 12c0-4.52 3.68-8.2 8.2-8.2s8.2 3.68 8.2 8.2-3.68 8.2-8.2 8.2z"></path><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.06 2.88 1.21 3.08c.15.2 2.09 3.2 5.07 4.49.71.3 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2-1.41.25-.7.25-1.29.17-1.42-.07-.13-.27-.2-.57-.35z"></path></svg>
            {{cta_texto}}
          </button>
          <p class="cta-final-thais-11__nota">{{nota}}</p>
        </div>
      </form>
    </div>
  </div>
</section>
