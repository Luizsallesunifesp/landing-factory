<section class="s-dor-elaine-03" data-secao="dor-elaine-03">
  <div class="lf-wrap">
    <div class="dor-elaine-03__head dor-elaine-03__reveal">
      <div>
        <span class="dor-elaine-03__eyebrow">{{eyebrow}}</span>
        <h2 class="dor-elaine-03__titulo">{{titulo}}</h2>
      </div>
      <p class="dor-elaine-03__subtitulo">{{subtitulo}}</p>
    </div>
    <div class="dor-elaine-03__grid dor-elaine-03__reveal">
      {{#sinais}}
      <div class="dor-elaine-03__card"><span class="dor-elaine-03__mark">{{rotulo}} {{@num}}</span><p class="dor-elaine-03__texto">{{texto}}</p></div>
      {{/sinais}}
    </div>
    <p class="dor-elaine-03__note">{{{nota_final}}}</p>
  </div>
</section>
