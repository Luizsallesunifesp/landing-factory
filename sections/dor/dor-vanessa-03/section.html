<section class="s-dor-vanessa-03" data-secao="dor-vanessa-03">
  <div class="dor-vanessa-03__container">
    <div class="dor-vanessa-03__head dor-vanessa-03__reveal">
      <span class="dor-vanessa-03__eyebrow">{{eyebrow}}</span>
      <h2 class="dor-vanessa-03__titulo">{{titulo}}</h2>
      <p class="dor-vanessa-03__subtitulo">{{subtitulo}}</p>
    </div>
    <div class="dor-vanessa-03__grid" data-stagger="">
      {{#itens}}
      <div class="dor-vanessa-03__card dor-vanessa-03__reveal"><span class="dor-vanessa-03__x">✕</span><p>{{texto}}</p></div>
      {{/itens}}
    </div>
    <p class="dor-vanessa-03__note dor-vanessa-03__reveal">{{nota}}</p>
  </div>
</section>
