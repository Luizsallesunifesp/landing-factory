<section class="s-servicos-acalm-head-spa-05" data-secao="servicos-acalm-head-spa-05">
  <div class="lf-wrap">
    <div class="servicos-acalm-head-spa-05__head" data-reveal>
      <div class="servicos-acalm-head-spa-05__eyebrow">{{eyebrow}}</div>
      <h2 class="servicos-acalm-head-spa-05__titulo">{{titulo}}</h2>
      <p class="servicos-acalm-head-spa-05__sub">{{subtitulo}}</p>
    </div>
    <div class="servicos-acalm-head-spa-05__grid" data-reveal>
      {{#itens}}
      <div class="servicos-acalm-head-spa-05__card">
        <div class="servicos-acalm-head-spa-05__icon">{{icone}}</div>
        <h3 class="servicos-acalm-head-spa-05__nome">{{nome}}</h3>
        <p class="servicos-acalm-head-spa-05__desc">{{descricao}}</p>
      </div>
      {{/itens}}
    </div>
  </div>
</section>
