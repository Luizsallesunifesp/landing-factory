<section class="s-servicos-renata-05" data-secao="servicos-renata-05">
  <div class="servicos-renata-05__wrap">
    <div class="servicos-renata-05__head servicos-renata-05__fade-up">
      <div class="servicos-renata-05__eyebrow">{{eyebrow}}</div>
      <h2 class="servicos-renata-05__titulo">{{titulo}}</h2>
      <p class="servicos-renata-05__subtitulo">{{subtitulo}}</p>
    </div>
    <div class="servicos-renata-05__grid servicos-renata-05__fade-up">
      {{#itens}}
      <div class="servicos-renata-05__card" data-desc="{{descricao}}">
        <h4 class="servicos-renata-05__nome">{{nome}} <span class="servicos-renata-05__ico">+</span></h4>
        <p class="servicos-renata-05__desc">{{descricao}}</p>
      </div>
      {{/itens}}
    </div>
  </div>
</section>
