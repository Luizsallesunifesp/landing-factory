<section class="s-servicos-karol-05" data-secao="servicos-karol-05">
  <div class="servicos-karol-05__wrap">
    <div class="servicos-karol-05__head servicos-karol-05__reveal">
      <div>
        <div class="servicos-karol-05__eyebrow">{{eyebrow}}</div>
        <h2 class="servicos-karol-05__titulo">{{titulo}}</h2>
      </div>
      <p class="servicos-karol-05__sub">{{subtitulo}}</p>
    </div>
    <div class="servicos-karol-05__grid">
      {{#itens}}
      <div class="servicos-karol-05__item">
        <div class="servicos-karol-05__ic">{{icone}}</div>
        <h4 class="servicos-karol-05__nome">{{nome}}</h4>
        <p class="servicos-karol-05__desc">{{descricao}}</p>
      </div>
      {{/itens}}
    </div>
    <div class="servicos-karol-05__nota servicos-karol-05__reveal">
      <span class="servicos-karol-05__tag">{{nota_tag}}</span>
      <p>{{nota_texto}}</p>
    </div>
  </div>
</section>
