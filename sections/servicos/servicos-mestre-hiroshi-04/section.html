<section class="s-servicos-mestre-hiroshi-04" data-secao="servicos-mestre-hiroshi-04">
  <div class="servicos-mestre-hiroshi-04__wrap">
    <h2 class="servicos-mestre-hiroshi-04__titulo" data-palavras>{{titulo}}</h2>
    <p class="servicos-mestre-hiroshi-04__corpo" data-rev>{{subtitulo}}</p>

    <ul class="servicos-mestre-hiroshi-04__indice" data-escalona>
      {{#itens}}
      <li class="servicos-mestre-hiroshi-04__item"><span class="servicos-mestre-hiroshi-04__t">{{nome}}</span></li>
      {{/itens}}
    </ul>

    <div class="servicos-mestre-hiroshi-04__cta-par" data-rev>
      <span class="servicos-mestre-hiroshi-04__glow">
        <a class="servicos-mestre-hiroshi-04__btn" href="{{cta_link}}">
          {{cta_texto}}
          <svg class="servicos-mestre-hiroshi-04__ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </span>
    </div>
  </div>
</section>
